<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistente Médico (Hospital) – Chat</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar__header">
          <div class="sidebar__title">Assistente Médico</div>
          <div class="sidebar__subtitle">Protótipos internos</div>
        </div>
        <div class="sidebar__section">
          <div class="sidebar__label">Paciente</div>
          <select id="patientSelect" class="sidebar__select">
            <option value="P-0001" selected>P-0001</option>
            <option value="P-0002">P-0002</option>
          </select>
        </div>
        <div class="sidebar__section">
          <div class="sidebar__label">Identificação</div>
          <input id="clinicianId" class="sidebar__input" placeholder="CRM / usuário" />
        </div>
        <div class="sidebar__section">
          <div class="sidebar__label">Modelo</div>
          <select id="llmMode" class="sidebar__select">
            <option value="default">Padrão (env)</option>
            <option value="anthropic">Claude (Anthropic)</option>
            <option value="ollama">Ollama (local)</option>
            <option value="hf_base">HF (base)</option>
            <option value="hf_finetuned">HF (fine-tuned/LoRA)</option>
          </select>
        </div>
        <div class="sidebar__section sidebar__hint">
          O assistente não prescreve. Respostas exigem validação médica e citam fontes internas quando disponíveis.
        </div>
      </aside>

      <main class="chat">
        <header class="chat__header">
          <div class="chat__headerTitle">
            <div class="chat__name">Chat Clínico</div>
            <div class="chat__status" id="chatStatus">online</div>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <footer class="composer">
          <input id="messageInput" class="composer__input" placeholder="Digite a dúvida clínica..." />
          <button id="sendBtn" class="composer__send">Enviar</button>
        </footer>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
